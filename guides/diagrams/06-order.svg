<text x='630.5' y='214.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>3 seven rear sleepers to line A</text>
<line x1='630.5' y1='169.0' x2='630.5' y2='188.5' stroke='#111' stroke-width='0.6' stroke-dasharray='2 2'/>
<rect x='760.5' y='188.5' width='234.0' height='52.0' fill='white' stroke='#111' stroke-width='1.2' opacity='1.0' stroke-dasharray='3 2'/>
<text x='877.5' y='214.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>4 bottom rear stringer, 3 pieces</text>
<line x1='877.5' y1='169.0' x2='877.5' y2='188.5' stroke='#111' stroke-width='0.6' stroke-dasharray='2 2'/>
<rect x='1007.5' y='188.5' width='234.0' height='52.0' fill='white' stroke='#111' stroke-width='1.2' opacity='1.0' stroke-dasharray='3 2'/>
<text x='1124.5' y='214.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>5 seven cross blocks</text>
<line x1='1124.5' y1='169.0' x2='1124.5' y2='188.5' stroke='#111' stroke-width='0.6' stroke-dasharray='2 2'/>
<rect x='19.5' y='253.5' width='234.0' height='52.0' fill='white' stroke='#111' stroke-width='1.2' opacity='1.0' stroke-dasharray='3 2'/>
<text x='136.5' y='279.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>6 front sleepers + front stringer</text>
<rect x='266.5' y='253.5' width='234.0' height='52.0' fill='white' stroke='#111' stroke-width='1.2' opacity='1.0' stroke-dasharray='3 2'/>
<text x='383.5' y='279.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>7 three bottoms, rear edge scribed</text>
<rect x='513.5' y='253.5' width='234.0' height='52.0' fill='white' stroke='#111' stroke-width='1.2' opacity='1.0' stroke-dasharray='3 2'/>
<text x='630.5' y='279.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>8 five dividers, notched over the rail</text>
<rect x='760.5' y='253.5' width='234.0' height='52.0' fill='white' stroke='#111' stroke-width='1.2' opacity='1.0' stroke-dasharray='3 2'/>
<text x='877.5' y='279.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>9 six top-front stringers</text>
<rect x='1007.5' y='253.5' width='234.0' height='52.0' fill='white' stroke='#111' stroke-width='1.2' opacity='1.0' stroke-dasharray='3 2'/>
<text x='1124.5' y='279.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>10 check plumb, line E, front plane</text>
<text x='19.5' y='347.8' font-size='11' text-anchor='start' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>Rails first: everything hangs off them, and nothing else squares the run.</text>
<text x='19.5' y='373.8' font-size='11' text-anchor='start' fill='#c0392b' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>Between 2 and 3: check bay 6 is 29-7/8 clear. If it is short, move divider 5 left and recut door 6</text>
<text x='19.5' y='396.5' font-size='11' text-anchor='start' fill='#c0392b' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>and the bay 6 top front stringer; the 1/4 end gap absorbs up to 1/8 either way.</text>
<text x='19.5' y='442.0' font-size='10' text-anchor='start' fill='#777' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>06-order: sequence only, not to scale.</text>
