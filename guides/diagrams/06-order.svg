<text x='383.5' y='80.5' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>2. TV LADDER</text>
<text x='383.5' y='94.2' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>guide 3 &#x27;TV ladder&#x27;</text>
<text x='383.5' y='108.0' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>steps 1 to 10</text>
<rect x='526.5' y='45.5' width='221.0' height='97.5' fill='#f4f4f4' stroke='#111' stroke-width='1.2' opacity='1.0'/>
<text x='637.0' y='80.5' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>3. KICKS</text>
<text x='637.0' y='94.2' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>tall, TV in 2 pieces,</text>
<text x='637.0' y='108.0' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>return</text>
<rect x='780.0' y='45.5' width='221.0' height='97.5' fill='#f4f4f4' stroke='#111' stroke-width='1.2' opacity='1.0'/>
<text x='890.5' y='80.5' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>4. DOORS</text>
<text x='890.5' y='94.2' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>guide 4 &#x27;Hang&#x27;</text>
<text x='890.5' y='108.0' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>tall, then TV 1 to 6</text>
<rect x='1033.5' y='45.5' width='221.0' height='97.5' fill='#f4f4f4' stroke='#111' stroke-width='1.2' opacity='1.0'/>
<text x='1144.0' y='80.5' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>5. TOP SLAB</text>
<text x='1144.0' y='94.2' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>guide 7</text>
<text x='1144.0' y='108.0' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>two pieces, jointed</text>
