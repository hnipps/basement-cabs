<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1274 468' width='1274' height='468'><title>Guide 6 - order of work</title><defs><pattern id='waste' width='8' height='8' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><line x1='0' y1='0' x2='0' y2='8' stroke='#999' stroke-width='1'/></pattern></defs><rect width='100%' height='100%' fill='white'/>
