<text x='130.0' y='80.5' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>1. TALL CABINET</text>
<text x='130.0' y='94.2' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>sleepers, plumb,</text>
<text x='130.0' y='108.0' font-size='11' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>screw to studs</text>
