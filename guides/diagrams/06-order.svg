<text x='383.5' y='214.5' font-size='10' text-anchor='middle' fill='#111' font-weight='normal' dominant-baseline='middle' font-family='Menlo, Consolas, monospace'>2 three 2x4 rails to the studs</text>
<line x1='383.5' y1='169.0' x2='383.5' y2='188.5' stroke='#111' stroke-width='0.6' stroke-dasharray='2 2'/>
